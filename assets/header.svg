<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="100%" height="220">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d0a">
        <animate attributeName="stop-color" values="#020d0a;#051d16;#01140e;#020d0a" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#051a14">
        <animate attributeName="stop-color" values="#051a14;#082a20;#041f17;#051a14" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#010806">
        <animate attributeName="stop-color" values="#010806;#041710;#020d0a;#010806" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <linearGradient id="neonGreenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#57ff38" />
    </linearGradient>

    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00b4d8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00ff9d" stop-opacity="0.8" />
    </linearGradient>

    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 46px;
      letter-spacing: 5px;
      fill: url(#neonGreenGrad);
    }
    .subtitle {
      font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
      font-size: 16px;
      fill: #a7f3d0;
      letter-spacing: 2px;
    }
    .badge {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 13px;
      fill: #00ff9d;
      font-weight: 700;
    }
    .grid-line {
      stroke: #00ff9d;
      stroke-opacity: 0.12;
      stroke-width: 1;
    }
    .scanline {
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.1; }
      50% { opacity: 0.25; }
      100% { transform: translateY(220px); opacity: 0.1; }
    }
    .pulse-dot {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }
  </style>

  <!-- Background Box -->
  <rect width="850" height="220" rx="16" fill="url(#cyberBg)" />
  <rect width="848" height="218" x="1" y="1" rx="15" fill="none" stroke="url(#cyberBorder)" stroke-width="2" />

  <!-- Security Grid Lines -->
  <line x1="60" y1="0" x2="60" y2="220" class="grid-line" />
  <line x1="180" y1="0" x2="180" y2="220" class="grid-line" />
  <line x1="670" y1="0" x2="670" y2="220" class="grid-line" />
  <line x1="790" y1="0" x2="790" y2="220" class="grid-line" />
  <line x1="0" y1="50" x2="850" y2="50" class="grid-line" />
  <line x1="0" y1="170" x2="850" y2="170" class="grid-line" />

  <!-- Animated Scanline -->
  <line x1="0" y1="0" x2="850" y2="0" stroke="#00ff9d" stroke-width="2" class="scanline" />

  <!-- Tech Corner Markers -->
  <path d="M 12 28 L 12 12 L 28 12" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 838 28 L 838 12 L 822 12" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 12 192 L 12 208 L 28 208" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 838 192 L 838 208 L 822 208" fill="none" stroke="#00ff9d" stroke-width="2.5" />

  <!-- Orbit Nodes -->
  <circle cx="120" cy="50" r="3" fill="#00ff9d" class="pulse-dot" />
  <circle cx="730" cy="170" r="4" fill="#00f0ff" class="pulse-dot" style="animation-delay: 1s;" />

  <!-- Top Security Status Pill -->
  <g transform="translate(305, 25)">
    <rect width="240" height="26" rx="13" fill="#01140e" fill-opacity="0.85" stroke="#00ff9d" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="17" class="badge">SEC-OPS: ZERO-TRUST DEFENSE</text>
  </g>

  <!-- Titles -->
  <g text-anchor="middle">
    <text x="425" y="115" class="title" filter="url(#matrixGlow)">SOUVIK DEY</text>
    <text x="425" y="152" class="subtitle">&lt; Cybersecurity Specialist &amp; Systems Developer /&gt;</text>
  </g>
</svg>
