<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 250" width="100%" height="250">
  <defs>
    <!-- Dark Cyber Matrix Gradient -->
    <linearGradient id="cyberSpaceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020e0a" />
      <stop offset="40%" stop-color="#042018" />
      <stop offset="80%" stop-color="#01150f" />
      <stop offset="100%" stop-color="#000806" />
    </linearGradient>

    <!-- Wave 1 Gradient (Dark Neon Teal) -->
    <linearGradient id="cyberWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#005f43" />
      <stop offset="50%" stop-color="#008f5d" />
      <stop offset="100%" stop-color="#003828" />
    </linearGradient>

    <!-- Wave 2 Gradient (Vivid Electric Neon Green) -->
    <linearGradient id="cyberWave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d" />
      <stop offset="50%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#57ff38" />
    </linearGradient>

    <!-- Wave 3 Gradient (Cyan Cyber Highlights) -->
    <linearGradient id="cyberWave3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#00ff9d" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#70e000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glowing Title Gradient -->
    <linearGradient id="cyberTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00ff9d" />
      <stop offset="70%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- Neon Matrix Glow Filter -->
    <filter id="matrixGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .name-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      font-size: 56px;
      font-weight: 900;
      letter-spacing: 6px;
      fill: url(#cyberTitleGrad);
      text-anchor: middle;
    }
    .role-subtitle {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 18px;
      font-weight: 600;
      fill: #a7f3d0;
      letter-spacing: 3px;
      text-anchor: middle;
    }
    .badge-text {
      font-family: 'Fira Code', Consolas, Monaco, monospace;
      font-size: 12px;
      font-weight: 700;
      fill: #00ff9d;
      letter-spacing: 2px;
    }
    .star {
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }
    .scanline {
      animation: scan 4s linear infinite;
    }
    @keyframes scan {
      0% { transform: translateY(0px); opacity: 0.15; }
      50% { opacity: 0.35; }
      100% { transform: translateY(250px); opacity: 0.15; }
    }
  </style>

  <!-- Canvas Box -->
  <rect width="1000" height="250" rx="18" fill="url(#cyberSpaceGrad)" />
  <rect width="996" height="246" x="2" y="2" rx="17" fill="none" stroke="#00ff9d" stroke-width="1.8" stroke-opacity="0.4" />

  <!-- Security Grid Lines -->
  <g stroke="#00ff9d" stroke-width="0.7" stroke-opacity="0.12">
    <line x1="100" y1="0" x2="100" y2="250" />
    <line x1="300" y1="0" x2="300" y2="250" />
    <line x1="500" y1="0" x2="500" y2="250" />
    <line x1="700" y1="0" x2="700" y2="250" />
    <line x1="900" y1="0" x2="900" y2="250" />
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="180" x2="1000" y2="180" />
  </g>

  <!-- Animated Matrix Scanline -->
  <line x1="0" y1="0" x2="1000" y2="0" stroke="#00ff9d" stroke-width="2.5" class="scanline" />

  <!-- Tech Corner Markers -->
  <path d="M 16 32 L 16 16 L 32 16" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 984 32 L 984 16 L 968 16" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 16 218 L 16 234 L 32 234" fill="none" stroke="#00ff9d" stroke-width="2.5" />
  <path d="M 984 218 L 984 234 L 968 234" fill="none" stroke="#00ff9d" stroke-width="2.5" />

  <!-- Twinkling Data Nodes -->
  <circle cx="80" cy="50" r="3" fill="#00ff9d" class="star" style="animation-delay: 0s;" />
  <circle cx="220" cy="90" r="2" fill="#00f0ff" class="star" style="animation-delay: 1.2s;" />
  <circle cx="780" cy="55" r="3.5" fill="#57ff38" class="star" style="animation-delay: 0.7s;" />
  <circle cx="920" cy="110" r="2.5" fill="#00ff9d" class="star" style="animation-delay: 1.8s;" />

  <!-- Dynamic Animated Morphing Wave 1 (Back Layer) -->
  <path fill="url(#cyberWave1)" opacity="0.6">
    <animate
      attributeName="d"
      dur="10s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
      values="
        M0,180 C200,140 400,220 600,170 C800,130 900,200 1000,165 L1000,250 L0,250 Z;
        M0,160 C250,210 450,140 650,190 C850,220 920,150 1000,185 L1000,250 L0,250 Z;
        M0,195 C180,150 380,210 580,160 C780,120 890,210 1000,175 L1000,250 L0,250 Z;
        M0,180 C200,140 400,220 600,170 C800,130 900,200 1000,165 L1000,250 L0,250 Z
      "
    />
  </path>

  <!-- Dynamic Animated Morphing Wave 2 (Middle Layer) -->
  <path fill="url(#cyberWave2)" opacity="0.65">
    <animate
      attributeName="d"
      dur="8s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
      values="
        M0,200 C250,165 450,225 650,185 C820,150 920,215 1000,190 L1000,250 L0,250 Z;
        M0,175 C180,225 380,165 600,215 C780,175 880,225 1000,175 L1000,250 L0,250 Z;
        M0,210 C220,180 420,230 630,190 C840,160 930,220 1000,200 L1000,250 L0,250 Z;
        M0,200 C250,165 450,225 650,185 C820,150 920,215 1000,190 L1000,250 L0,250 Z
      "
    />
  </path>

  <!-- Dynamic Animated Morphing Wave 3 (Front Vibrant Foam) -->
  <path fill="url(#cyberWave3)" opacity="0.5">
    <animate
      attributeName="d"
      dur="6s"
      repeatCount="indefinite"
      calcMode="spline"
      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1"
      values="
        M0,225 C200,195 400,240 600,210 C800,180 900,230 1000,215 L1000,250 L0,250 Z;
        M0,210 C230,235 430,195 650,230 C830,200 920,240 1000,220 L1000,250 L0,250 Z;
        M0,230 C180,205 380,245 580,215 C780,185 880,235 1000,225 L1000,250 L0,250 Z;
        M0,225 C200,195 400,240 600,210 C800,180 900,230 1000,215 L1000,250 L0,250 Z
      "
    />
  </path>

  <!-- Top Security Status Pill -->
  <g transform="translate(365, 22)">
    <rect width="270" height="28" rx="14" fill="#000806" fill-opacity="0.9" stroke="#00ff9d" stroke-width="1.2" />
    <circle cx="16" cy="14" r="4.5" fill="#00ff9d">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="r" values="4.5;6;4.5" dur="1.2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="19" class="badge-text">STATUS: ZERO-TRUST DEFENSE</text>
  </g>

  <!-- Name and Subtitle -->
  <text x="500" y="112" class="name-title" filter="url(#matrixGlow)">SOUVIK DEY</text>
  <text x="500" y="152" class="role-subtitle">🛡️ Cybersecurity Specialist &amp; Systems Developer 🛡️</text>
</svg>
